name: CI

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'src/**'
      - 'tests/**'
      - 'packages/rconx_cli/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mypy.ini'
      - 'README.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_to_test_pypi:
        description: Publish to TestPyPI
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate release conditions
    runs-on: ubuntu-latest
    outputs:
      is_tagged_release: ${{ steps.evaluate.outputs.is_tagged_release }}
      should_publish: ${{ steps.evaluate.outputs.should_publish }}
    steps:
      - name: Evaluate release conditions
        id: evaluate
        env:
          IS_TAGGED_RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          IS_MANUAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_to_test_pypi }}
        run: |
          echo "is_tagged_release=$IS_TAGGED_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$IS_TAGGED_RELEASE" == 'true' || "$IS_MANUAL_RELEASE" == 'true' ]]; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  pypi_upload:
    name: Publish packages to PyPI
    needs: [test, build, evaluate]

    environment: pypi_release
    permissions:
      id-token: write

    runs-on: ubuntu-latest
    if: ${{ needs.evaluate.outputs.is_tagged_release == 'true' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  pypi_upload_test:
    name: Publish packages to TestPyPI
    needs: [test, build, evaluate]

    environment: pypi_release
    permissions:
      id-token: write

    runs-on: ubuntu-latest
    if: ${{ needs.evaluate.outputs.should_publish == 'true' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
