name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --dev

      - name: Run pytest
        run: uv run --no-sync pytest tests
